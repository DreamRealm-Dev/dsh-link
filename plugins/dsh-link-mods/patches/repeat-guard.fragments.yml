# dsh-anti-repeat-suite — dsh-repeat-guard 拦截短句表（settings 种子）
#
# 这一份不是 profile 补丁，而是 dsh 的 settings 命名空间内容。
# 落到 $DSH_HOME/settings.yaml 的顶层键 `repeat-guard:` 下即可（改完即时生效，无需重启）；
# 也可以在 GUI 的「设置 → 复读打断」里逐项编辑同一个命名空间。
#
# 判据回顾（lib/detect.js）：把思考文本按行切开，**整行 trim + 小写后与表项全等**才算命中；
# 开了 inlineRepeat 后，"整行由多个表项首尾相接拼成"也按每段各记一次。
# 因此表项必须连标点照原样写，且只对"单独成段的空话"有效。
#
# 取向：覆盖上游已知的全部形态（中英混合、带标点/不带标点、let me / we need / wait 等），
# 而不是只针对某一句。阈值取 2（连续命中两次才动手），因为表变宽之后单次命中更可能是
# 正常收尾语；真正的复读一定会连着来，两次足够触发。
repeat-guard:
  # 连续命中 2 次才掐断：默认 1 对宽表太敏感。
  threshold: 2
  # 行内重复也计命中：兜住"好。好。好。"挤在一行里的模型。
  inlineRepeat: true
  fragments:
    # ── 上游默认表（原样保留） ──────────────────────────────────────────
    - '好。'
    - '好的。'
    - '好嘞。'
    - '对。'
    - '对的。'
    - '是。'
    - '是的。'
    - '行。'
    - '嗯。'
    - '可以。'
    - '明白。'
    - '收到。'
    - '了解。'
    - '执行。'
    - '继续。'
    - '确认。'
    - '完成。'
    - '搞定。'
    - '写。'
    - '查。'
    - '看。'
    - 'ok.'
    - 'okay.'
    - 'sure.'
    - 'alright.'
    - 'right.'
    - 'yes.'
    - 'done.'
    - 'got it.'
    - 'let me go.'
    - 'let me do it.'
    - 'check it.'
    # ── 补充：中文空话（含无标点形态） ──────────────────────────────────
    - '好'
    - '好的'
    - '好嘞'
    - '对'
    - '对的'
    - '是'
    - '是的'
    - '行'
    - '嗯'
    - '可以'
    - '明白'
    - '收到'
    - '了解'
    - '执行'
    - '继续'
    - '确认'
    - '完成'
    - '搞定'
    - '开始。'
    - '开始'
    - '做。'
    - '做'
    - '干。'
    - '上。'
    - '来。'
    - '走。'
    - '改。'
    - '修。'
    - '调用。'
    - '运行。'
    - '检查。'
    - '验证。'
    - '测试。'
    - '下一步。'
    - '接下来。'
    - '然后。'
    - '现在。'
    - '首先。'
    # ── 补充：英文空话（"We need" / "Let me" / 犹豫词） ─────────────────
    - 'we need.'
    - 'we need'
    - 'we need to.'
    - 'we need to'
    - 'we need do.'
    - 'we should.'
    - 'we should'
    - 'we can.'
    - 'we can'
    - 'i need to.'
    - 'i need to'
    - 'i will.'
    - 'i will'
    - 'let me.'
    - 'let me'
    - 'let me run.'
    - 'let me check.'
    - 'let me start.'
    - 'let me see.'
    - 'let me try.'
    - 'let us.'
    - 'wait.'
    - 'wait'
    - 'actually.'
    - 'actually'
    - 'hmm.'
    - 'hmm'
    - 'now.'
    - 'go.'
    - 'do it.'
    - 'do.'
    - 'start.'
    - 'begin.'
    - 'next.'
    - 'first.'
    - 'then.'
    - 'run.'
    - 'check.'
    - 'verify.'
    - 'ok'
    - 'okay'
    - 'sure'
    - 'alright'
    - 'right'
    - 'yes'
    - 'done'
  # 掐断后推给模型的续跑指令：把"不要再空转"按中英双语各写一遍，
  # 免得模型换一种语言接着复读。
  resumeText: |-
    [复读拦截]
    你上一段思考退化成了碎片复读（反复输出"好。"、"We need"、"Let me"一类的空话），已被系统截断。
    请直接执行下一步的结论，不要再输出任何确认语、寒暄、复述或空话；需要工具就直接发起工具调用。
  resumeSummary: '复读已截断：请继续执行'
  # 计数由插件自己维护（每次掐断 +1），这里从 0 起步。
  count: 0
