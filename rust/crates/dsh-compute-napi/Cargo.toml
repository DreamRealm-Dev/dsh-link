[package]
name = "dsh-compute-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "DSH-LINK native compute core: collaboration-ledger fold and team-status index over N-API."

[lib]
# cdylib is the addon; rlib lets `cargo test -p dsh-compute-napi` exercise the
# pure Rust fold/index without Node in the loop.
crate-type = ["cdylib", "rlib"]

[dependencies]
# napi 2.x with the Node-API 8 floor, no compat-mode features: the addon loads on
# Node >= 16 and the stable N-API ABI survives Node minor upgrades without a rebuild.
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
